<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>WordCraft</title>
  <link rel="icon" href="./wordcraft-fa59e09a3f921e03.ico" integrity="sha384-99DzWb82rFgkdw7hjKziyDQaHbMTklb9MWeLKF7LcVUnq80H4nDrc/pjHJtAj/AA"/>
  
<script type="module">
import './neiva-locale.js';
import init, * as bindings from './wordcraft-web-bc9cdbc0b42827ee.js';
// NeivaPoints hosting adaptation: decompress the unchanged official engine in the browser.
let wasm;
try {
  if (!('DecompressionStream' in window)) throw new Error('Atualize o navegador para abrir o WordCraft.');
  const packed = await fetch('./wordcraft-web-bc9cdbc0b42827ee_bg.wasm.gz');
  if (!packed.ok || !packed.body) throw new Error('Não foi possível baixar o WordCraft. Tente novamente.');
  // Some hosts transparently decompress .gz responses; accept either representation.
  const response = /gzip/i.test(packed.headers.get('Content-Encoding') || '')
    ? new Response(packed.body, {headers: {'Content-Type': 'application/wasm'}})
    : new Response(packed.body.pipeThrough(new DecompressionStream('gzip')), {headers: {'Content-Type': 'application/wasm'}});
  wasm = await init({module_or_path: response});
} catch (error) {
  const message = error instanceof Error ? error.message : 'Falha ao iniciar o WordCraft.';
  document.addEventListener('DOMContentLoaded', () => { document.getElementById('wordcraft_loading').textContent = message; });
  if (window.parent !== window) window.parent.postMessage({type: 'wordcraft:failed', error: message}, location.origin);
  throw error;
}


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; }
    #wordcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
