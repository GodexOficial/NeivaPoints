<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GridCraft</title>
  <link rel="icon" href="./gridcraft-45f84b7721cb79a9.ico" integrity="sha384-FzBCWcgv5VqBLEPSBvyC78gOs2HMh3hKu2LSLSXU01NgL5yKLk/nHdINuu0Ztky1"/>
  
<script type="module">
import './neiva-locale.js';
import init, * as bindings from './gridcraft-web-fdc723373f2aa0d8.js';
// NeivaPoints: browser decompression; the official GridCraft engine is unchanged.
let wasm;
try {
 if (!('DecompressionStream' in window)) throw new Error('Atualize o navegador para abrir o GridCraft.');
 const packed = await fetch('./gridcraft-web-fdc723373f2aa0d8_bg.wasm.gz');
 if (!packed.ok || !packed.body) throw new Error('Não foi possível carregar o GridCraft.');
 const body = /gzip/i.test(packed.headers.get('Content-Encoding') || '') ? packed.body : packed.body.pipeThrough(new DecompressionStream('gzip'));
 wasm = await init({module_or_path: new Response(body, {headers: {'Content-Type': 'application/wasm'}})});
} catch (error) {
 const message = error instanceof Error ? error.message : 'Falha ao iniciar o GridCraft.';
 const show = () => { const label = document.getElementById('gridcraft_loading'); if (label) label.textContent = message; };
 if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show, {once: true}); else show();
 if (window.parent !== window) window.parent.postMessage({type: 'gridcraft:failed', error: message}, location.origin);
 throw error;
}


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f3f3; }
    #gridcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #gridcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
